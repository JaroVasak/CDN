- name: Configure Docker
  hosts: docker
  become: true
  vars:
    docker_compose_version: "2.29.7"
  tasks:
    - name: Install required dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
        state: present
        update_cache: yes

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name: docker-ce
        state: present
        update_cache: yes

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
        dest: "/usr/local/bin/docker-compose"
        mode: 'u+x'

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ansible user to docker group
      user:
        name: ansible
        groups: docker
        append: yes

    - name: Copy docker-compose directory to the Docker VM
      synchronize:
        src: ../docker/monitoring/  
        dest: /opt/docker/monitoring/
        mode: push
        recursive: yes
        owner: root #consider changing it to another user, e.g.ansible, or docker
        group: root #consider changing it to another user, e.g.ansible, or docker

    - name: Run Docker Compose
      command: "docker-compose -f /opt/docker/monitoring/docker-compose.yml up -d"
      args:
        chdir: /opt/docker/monitoring/

