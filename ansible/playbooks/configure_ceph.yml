- name: Configure Ceph Cluster
  hosts: ceph
  become: true
  vars:
    ceph_release: "reef"
  tasks:
    - name: Add Ceph GPG key
      apt_key:
        url: "https://download.ceph.com/keys/release.asc"
        state: present

    - name: Configure Ceph repository
      apt_repository:
        repo: "deb https://download.ceph.com/debian-{{ ceph_release }}/ {{ ansible_lsb.codename }} main"
        state: present

    - name: Install cephadm prerequisites
      apt:
        name:
          - curl
          - gnupg2
          - python3
          - lvm2
        state: present
        update_cache: yes

    - name: Install cephadm
      apt:
        name: cephadm
        state: present

    - name: Bootstrap Ceph cluster on first monitor node
      command: cephadm bootstrap --mon-ip {{ ansible_host }} --initial-dashboard-user admin --initial-dashboard-password changeme
      args:
        creates: /etc/ceph/ceph.conf
      when: inventory_hostname == groups['ceph'][0]

    - name: Add additional nodes to cluster
      command: cephadm shell -- ceph orch host add {{ item }}
      loop: "{{ groups['ceph'][1:] }}"
      when: inventory_hostname == groups['ceph'][0]

    - name: Deploy OSDs on all nodes
      command: cephadm shell -- ceph orch apply osd --all-available-devices
      when: inventory_hostname == groups['ceph'][0]

    # TODO: configure Prometheus metrics endpoint via cephadm dashboard module
